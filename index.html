<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pbpye İngilizce Flash Card</title>
  
  <!-- CSS & Font Kütüphaneleri -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React Kütüphaneleri -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #090a0f; color: #f1f5f9; overflow-x: hidden; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-preserve-3d { transform-style: preserve-3d; }
    .backface-visibility-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 👇👇👇 SENİN KELİME LİSTENİ YAPIŞTIRACAĞIN YER BURASI 👇👇👇
    // DİKKAT: Sadece köşeli parantezlerin [ ] içini değiştir.
    let RAW_JSON_DATA = `[ 
      
      /* KELİMELERİNİ BURAYA YAPIŞTIR */ 
      
    ]`;
    // 👆👆👆 KELİMELER BURAYA YAPIŞTIRILACAK 👆👆👆

    let INITIAL_FLASHCARDS = [];
    let jsonError = null;
    try {
        let hamListe = JSON.parse(RAW_JSON_DATA);
        
        // Kusursuz Çift Kelime Temizleyici (Set Yöntemi)
        let temizListe = [];
        let gorulenKelimeler = new Set();
        
        for (let i = 0; i < hamListe.length; i++) {
            let kelime = hamListe[i];
            let kontrolKelimesi = kelime.english.toLowerCase().trim();
            
            if (!gorulenKelimeler.has(kontrolKelimesi)) {
                gorulenKelimeler.add(kontrolKelimesi);
                temizListe.push(kelime);
            }
        }
        
        INITIAL_FLASHCARDS = temizListe.sort((a, b) => a.english.localeCompare(b.english));
        
    } catch (e) {
        jsonError = "Kelime yükleme hatası (JSON): " + e.message;
        INITIAL_FLASHCARDS = [];
    }

    const translationCache = new Map();

    function App() {
      // ŞİFRE SİSTEMİ
      const [isLocked, setIsLocked] = React.useState(() => localStorage.getItem('app_unlocked_v1') !== 'true');
      const [passwordInput, setPasswordInput] = React.useState('');
      const [passwordError, setPasswordError] = React.useState(false);

      const handleLogin = (e) => {
          e.preventDefault();
          if (passwordInput === 'pbpye31') { 
              localStorage.setItem('app_unlocked_v1', 'true');
              window.location.reload(); // Otomatik F5 atar ve siyah ekranı engeller
          } else {
              setPasswordError(true);
              setPasswordInput('');
          }
      };

      if (isLocked) return (
          <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center p-6 font-sans">
              <div className="bg-slate-900/85 backdrop-blur-md border border-slate-700 p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
                  <div className="w-16 h-16 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                      <i className="fa-solid fa-lock"></i>
                  </div>
                  <h2 className="text-2xl font-bold text-white mb-2">Uygulama Kilitli</h2>
                  <p className="text-slate-400 mb-6 text-sm">Devam etmek için lütfen giriş şifresini yazın.</p>
                  
                  <form onSubmit={handleLogin} className="flex flex-col gap-4">
                      <input 
                          type="password" 
                          value={passwordInput}
                          onChange={(e) => { setPasswordInput(e.target.value); setPasswordError(false); }}
                          placeholder="Şifrenizi girin..."
                          className={`w-full bg-slate-800 border ${passwordError ? 'border-rose-500' : 'border-slate-600'} text-white px-4 py-3 rounded-xl focus:outline-none focus:border-blue-500 transition-colors text-center tracking-widest`}
                      />
                      {passwordError && <span className="text-rose-400 text-xs font-semibold">Hatalı şifre, tekrar deneyin!</span>}
                      <button 
                          type="submit" 
                          className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2"
                      >
                          Giriş Yap <i className="fa-solid fa-arrow-right"></i>
                      </button>
                  </form>
              </div>
          </div>
      );
      
      if (jsonError) {
        return (
          <div className="min-h-screen bg-[#090a0f] flex items-center justify-center p-4">
            <div className="bg-rose-950/50 border border-rose-500 rounded-3xl p-8 max-w-lg text-center shadow-[0_0_50px_rgba(244,63,94,0.3)]">
              <i className="fa-solid fa-triangle-exclamation text-6xl text-rose-500 mb-6"></i>
              <h2 className="text-2xl font-bold text-white mb-4">SİSTEM ÇÖKMESİ ENGELLENDİ</h2>
              <p className="text-rose-200 mb-4 text-sm leading-relaxed">
                Kelimeleri yapıştırırken bir format hatası oluştu (muhtemelen eksik bir virgül, parantez veya fazladan tırnak işareti).
              </p>
              <div className="bg-slate-950 p-4 rounded-xl text-left border border-rose-500/30 overflow-auto">
                <code className="text-rose-400 text-xs font-mono">{jsonError}</code>
              </div>
              <p className="text-slate-400 mt-4 text-xs">Lütfen GitHub'a gidip yapıştırdığınız JSON verisini kontrol edin.</p>
            </div>
          </div>
        );
      }

      const [deck, setDeck] = useState(() => {
        const saved = localStorage.getItem('pbpye_deck');
        return saved ? JSON.parse(saved) : INITIAL_FLASHCARDS;
      });
      const [currentIndex, setCurrentIndex] = useState(() => {
        const saved = localStorage.getItem('pbpye_currentIndex');
        return saved ? parseInt(saved, 10) : 0;
      });
      const [isFlipped, setIsFlipped] = useState(false);
      const [knownWords, setKnownWords] = useState(() => {
        const saved = localStorage.getItem('pbpye_known');
        return saved ? JSON.parse(saved) : [];
      });
      const [unknownWords, setUnknownWords] = useState(() => {
        const saved = localStorage.getItem('pbpye_unknown');
        return saved ? JSON.parse(saved) : [];
      });
      const [newWordsList, setNewWordsList] = useState(() => {
        const saved = localStorage.getItem('pbpye_newWords');
        return saved ? JSON.parse(saved) : [];
      });
      const [isFinished, setIsFinished] = useState(false);
      const [score, setScore] = useState(0);

      useEffect(() => { localStorage.setItem('pbpye_deck', JSON.stringify(deck)); }, [deck]);
      useEffect(() => { localStorage.setItem('pbpye_currentIndex', currentIndex.toString()); }, [currentIndex]);
      useEffect(() => { localStorage.setItem('pbpye_known', JSON.stringify(knownWords)); }, [knownWords]);
      useEffect(() => { localStorage.setItem('pbpye_unknown', JSON.stringify(unknownWords)); }, [unknownWords]);
      useEffect(() => { localStorage.setItem('pbpye_newWords', JSON.stringify(newWordsList)); }, [newWordsList]);
      
      const [isSidebarOpen, setIsSidebarOpen] = useState(false);
      const [isDictionaryOpen, setIsDictionaryOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [dictionaryResult, setDictionaryResult] = useState(null);
      const [isSearching, setIsSearching] = useState(false);
      
      const [showTurkishPrompt, setShowTurkishPrompt] = useState(false);
      const [selectedText, setSelectedText] = useState('');
      const [translatedText, setTranslatedText] = useState('');
      const [isTranslating, setIsTranslating] = useState(false);

      const [isJumpModalOpen, setIsJumpModalOpen] = useState(false);
      const [jumpTarget, setJumpTarget] = useState('');
      const [revealedItems, setRevealedItems] = useState({});

      const fileInputRef = useRef(null);
      const [uploadMessage, setUploadMessage] = useState({ text: '', type: '' });

      const fetchTranslation = async (text) => {
        const cacheKey = text.toLowerCase();
        if (translationCache.has(cacheKey)) {
          return translationCache.get(cacheKey);
        }
        try {
          const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q=${encodeURIComponent(text)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data && data[0]) {
            const finalTranslation = data[0].map(item => item[0]).join('');
            translationCache.set(cacheKey, finalTranslation);
            return finalTranslation;
          }
        } catch (err) {
          console.error("Çeviri hatası:", err);
        }
        return null;
      };

      const handleTextSelection = () => {
        const selection = window.getSelection();
        if (selection && selection.toString().trim()) {
          setSelectedText(selection.toString().trim());
          setShowTurkishPrompt(true);
        }
      };

      const closeTranslationPrompt = () => {
        setShowTurkishPrompt(false);
        setSelectedText('');
        setTranslatedText('');
      };

      const handleWordClick = (e, word) => {
        e.stopPropagation();
        const selection = window.getSelection();
        if (selection && selection.toString().trim().length > 0) return;
        const cleanWord = word.replace(/[.,/#!$%^&*;:{}=\-_`~()"]/g,"").trim();
        if (cleanWord) {
          setSelectedText(cleanWord);
          setTranslatedText('');
          setShowTurkishPrompt(true);
          translateSelectedTextForWord(cleanWord);
        }
      };

      const translateSelectedTextForWord = async (wordToTranslate) => {
        setIsTranslating(true);
        const result = await fetchTranslation(wordToTranslate);
        setTranslatedText(result || "Çeviri bulunamadı.");
        setIsTranslating(false);
      };

      const handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const uploadedData = JSON.parse(e.target.result);
            if (Array.isArray(uploadedData) && uploadedData.length > 0 && uploadedData[0].english) {
              const combined = [...deck, ...uploadedData];
              const uniqueMap = new Map();
              combined.forEach(item => {
                const key = item.english.trim().toLowerCase();
                if (!uniqueMap.has(key)) {
                  uniqueMap.set(key, item);
                }
              });
              const mergedDeck = Array.from(uniqueMap.values()).sort((a, b) => a.english.localeCompare(b.english));
              
              setDeck(mergedDeck);
              setIsFinished(false);
              setUploadMessage({ text: `[SECURE] ${uploadedData.length} kelime yüklendi & sıralandı!`, type: 'success' });
              setTimeout(() => setUploadMessage({ text: '', type: '' }), 4000);
            } else {
              throw new Error("Geçersiz format");
            }
          } catch (error) {
            setUploadMessage({ text: '[ERROR] Geçersiz dosya formatı!', type: 'error' });
            setTimeout(() => setUploadMessage({ text: '', type: '' }), 3000);
          }
        };
        reader.readAsText(file);
        event.target.value = null; 
      };

      const currentWord = deck[currentIndex];

      const handleCardClick = () => {
        const selection = window.getSelection();
        if (selection && selection.toString().length > 0) return;
        setIsFlipped(!isFlipped);
      };

      const playAudio = (e, wordToPlay = null) => {
        if (e) e.stopPropagation();
        const targetWord = wordToPlay || (currentWord ? currentWord.english : '');
        if (targetWord) {
          const utterance = new SpeechSynthesisUtterance(targetWord);
          utterance.lang = 'en-US';
          window.speechSynthesis.speak(utterance);
        }
      };

      const playSentenceAudio = (e, sentenceToPlay) => {
        e.stopPropagation();
        if (sentenceToPlay) {
          const utterance = new SpeechSynthesisUtterance(sentenceToPlay);
          utterance.lang = 'en-US';
          window.speechSynthesis.speak(utterance);
        }
      };

      const handleNext = () => {
        if (currentIndex < deck.length - 1) {
          setCurrentIndex(currentIndex + 1);
          setIsFlipped(false);
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(currentIndex - 1);
          setIsFlipped(false);
        }
      };

      const handleJumpToCard = (e, specificIndex = null) => {
        if (e) e.preventDefault();
        let targetIndex = specificIndex;
        
        if (targetIndex === null) {
          const targetNum = parseInt(jumpTarget, 10);
          if (!isNaN(targetNum) && targetNum >= 1 && targetNum <= deck.length) {
            targetIndex = targetNum - 1;
          } else {
            const foundIdx = deck.findIndex(w => 
              w.english.toLowerCase().includes(jumpTarget.toLowerCase()) ||
              w.turkish.toLowerCase().includes(jumpTarget.toLowerCase())
            );
            if (foundIdx !== -1) {
              targetIndex = foundIdx;
            } else {
              setUploadMessage({ text: `[WARN] Eşleşme bulunamadı!`, type: 'error' });
              setTimeout(() => setUploadMessage({ text: '', type: '' }), 3000);
              return;
            }
          }
        }

        if (targetIndex !== null && targetIndex >= 0 && targetIndex < deck.length) {
          setCurrentIndex(targetIndex);
          setIsFlipped(false);
          setIsJumpModalOpen(false);
          setJumpTarget('');
          setIsSidebarOpen(false);
        }
      };

      const jumpToWordByEnglish = (englishWord) => {
        const foundIdx = deck.findIndex(w => w.english.toLowerCase() === englishWord.toLowerCase());
        if (foundIdx !== -1) {
          setCurrentIndex(foundIdx);
          setIsFlipped(false);
          setIsSidebarOpen(false);
        }
      };

      const handleKnown = () => {
        setUnknownWords(unknownWords.filter(w => w.english !== currentWord.english));
        if (!knownWords.find(w => w.english === currentWord.english)) {
          setKnownWords([...knownWords, currentWord]);
          setScore(score + 10);
        }
        if (currentIndex < deck.length - 1) {
          handleNext();
        } else {
          setIsFinished(true);
        }
      };

      const handleUnknown = () => {
        setKnownWords(knownWords.filter(w => w.english !== currentWord.english));
        if (!unknownWords.find(w => w.english === currentWord.english)) {
          setUnknownWords([...unknownWords, currentWord]);
        }
        if (currentIndex < deck.length - 1) {
          handleNext();
        } else {
          setIsFinished(true);
        }
      };

      const removeFromLists = (englishWord) => {
        setKnownWords(knownWords.filter(w => w.english !== englishWord));
        setUnknownWords(unknownWords.filter(w => w.english !== englishWord));
        setNewWordsList(newWordsList.filter(w => w.english !== englishWord));
      };

      const restartDeck = () => {
        setCurrentIndex(0);
        setIsFlipped(false);
        setKnownWords([]);
        setUnknownWords([]);
        setScore(0);
        setIsFinished(false);
      };

      const searchDictionary = async () => {
        if (!searchQuery.trim()) return;
        setIsSearching(true);
        setDictionaryResult(null);

        const result = await fetchTranslation(searchQuery);
        if (result) {
           setDictionaryResult({
              english: searchQuery.trim(),
              turkish: result,
              type: "dict.",
              example: "Sözlük veritabanından eklendi."
           });
        } else {
           setUploadMessage({ text: '[WARN] Sonuç bulunamadı.', type: 'error' });
           setTimeout(() => setUploadMessage({ text: '', type: '' }), 3000);
        }
        setIsSearching(false);
      };

      const addDictionaryWordToDeck = () => {
        if (dictionaryResult) {
          const combined = [...deck, dictionaryResult];
          const uniqueMap = new Map();
          combined.forEach(item => {
            const key = item.english.trim().toLowerCase();
            if (!uniqueMap.has(key)) {
              uniqueMap.set(key, item);
            }
          });
          const newDeck = Array.from(uniqueMap.values()).sort((a, b) => a.english.localeCompare(b.english));

          setDeck(newDeck);
          setDictionaryResult(null);
          setSearchQuery('');
          setIsDictionaryOpen(false);
          setUploadMessage({ text: '[SUCCESS] Kelime ana desteye eklendi & sıralandı!', type: 'success' });
          setTimeout(() => setUploadMessage({ text: '', type: '' }), 3000);
        }
      };

      const toggleReveal = (id) => {
        setRevealedItems(prev => ({ ...prev, [id]: !prev[id] }));
      };

      if (isFinished) {
        return (
          <div className="min-h-screen bg-[#090a0f] text-slate-100 flex flex-col items-center justify-center p-4 font-sans relative overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-rose-950/30 via-slate-950 to-slate-950 pointer-events-none"></div>
            <div className="bg-slate-900/85 backdrop-blur-xl border border-rose-500/30 rounded-3xl p-8 max-w-md w-full shadow-[0_0_50px_rgba(244,63,94,0.15)] text-center relative z-10">
              <div className="w-20 h-20 bg-rose-500/10 border border-rose-500/30 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i className="fa-solid fa-wand-magic-sparkles text-4xl text-rose-400 animate-pulse"></i>
              </div>
              <h2 className="text-3xl font-extrabold text-white mb-2 tracking-wider">NEURAL SYNC COMPLETE</h2>
              <p className="text-rose-300/70 mb-8 text-sm">Tüm veri kümeleri başarıyla işlendi.</p>
              <button 
                onClick={restartDeck}
                className="w-full bg-gradient-to-r from-rose-600 to-purple-600 hover:from-rose-500 hover:to-purple-500 text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2 transition-all shadow-[0_0_20px_rgba(244,63,94,0.4)] border border-rose-400/30"
              >
                <i className="fa-solid fa-rotate-left"></i> YENİDEN BAŞLAT
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#090a0f] text-slate-100 flex flex-col items-center justify-between py-10 px-4 font-sans relative overflow-x-hidden selection:bg-rose-500 selection:text-white">
          
          <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-rose-600/10 blur-[150px] rounded-full pointer-events-none"></div>

          <div className="absolute left-2 sm:left-6 top-6 hidden sm:flex flex-col items-center z-20 pointer-events-none">
            <div className="w-8 sm:w-10 h-3 bg-rose-950 border border-rose-500 rounded-t-lg shadow-[0_0_15px_#f43f5e]"></div>
            <div className="w-16 sm:w-20 h-16 sm:h-20 bg-rose-600/30 rounded-full blur-xl absolute top-3 animate-pulse"></div>
            <div className="w-2.5 sm:w-3 h-2.5 sm:h-3 bg-rose-400 rounded-full shadow-[0_0_30px_#f43f5e] mt-1"></div>
            <div className="w-1.5 h-28 sm:h-36 bg-gradient-to-b from-rose-700 via-rose-900 to-slate-950"></div>
          </div>

          <div className="absolute right-2 sm:right-6 top-6 hidden sm:flex flex-col items-center z-20 pointer-events-none">
            <div className="w-8 sm:w-10 h-3 bg-purple-950 border border-purple-500 rounded-t-lg shadow-[0_0_15px_#a855f7]"></div>
            <div className="w-16 sm:w-20 h-16 sm:h-20 bg-purple-600/30 rounded-full blur-xl absolute top-3 animate-pulse"></div>
            <div className="w-2.5 sm:w-3 h-2.5 sm:h-3 bg-purple-400 rounded-full shadow-[0_0_30px_#a855f7] mt-1"></div>
            <div className="w-1.5 h-28 sm:h-36 bg-gradient-to-b from-purple-700 via-purple-900 to-slate-950"></div>
          </div>

          <div className="fixed bottom-4 right-4 z-50 flex items-center gap-2 px-3.5 py-2 bg-slate-900/90 backdrop-blur-md rounded-2xl border border-rose-500/30 shadow-[0_0_15px_rgba(244,63,94,0.2)] pointer-events-none">
            <i className="fa-brands fa-instagram text-rose-400"></i>
            <span className="text-xs font-bold text-rose-300 tracking-wider">pbpye</span>
          </div>

          {uploadMessage.text && (
            <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 rounded-2xl shadow-2xl font-bold text-white transition-all flex items-center gap-2 backdrop-blur-md border ${uploadMessage.type === 'error' ? 'bg-rose-950/80 border-rose-500 text-rose-200' : 'bg-purple-950/80 border-purple-500 text-purple-200'}`}>
              {uploadMessage.type === 'error' ? <i className="fa-solid fa-xmark text-rose-400"></i> : <i className="fa-solid fa-wand-magic-sparkles text-purple-400"></i>}
              {uploadMessage.text}
            </div>
          )}

          <div className="w-full flex flex-col items-center relative z-10">
            <div className="max-w-md w-full mb-8 text-center flex flex-col items-center relative">
              <div className="flex w-full justify-center items-center gap-3 sm:gap-6 mb-4">
                <div className="w-20 sm:w-24">
                  <button
                    onClick={() => setIsSidebarOpen(true)}
                    className="flex w-full flex-col items-center justify-center text-purple-300 hover:text-white transition-colors p-2.5 bg-slate-900/85 backdrop-blur-md rounded-2xl shadow-lg border border-purple-500/20 hover:border-purple-500/50 group"
                  >
                    <i className="fa-solid fa-bars text-xl mb-1 group-hover:scale-110 transition-transform text-purple-400"></i>
                    <span className="text-[9px] font-bold uppercase tracking-widest text-slate-400">LİSTE</span>
                  </button>
                </div>
                
                <div className="w-20 sm:w-24">
                  <input type="file" accept=".json" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    className="flex w-full flex-col items-center justify-center text-rose-300 hover:text-white transition-colors p-2.5 bg-slate-900/85 backdrop-blur-md rounded-2xl shadow-lg border border-rose-500/20 hover:border-rose-500/50 group"
                  >
                    <i className="fa-solid fa-cloud-arrow-up text-xl mb-1 group-hover:scale-110 transition-transform text-rose-400"></i>
                    <span className="text-[9px] font-bold uppercase tracking-widest text-slate-400">YÜKLE</span>
                  </button>
                </div>

                <div className="w-20 sm:w-24">
                  <button
                    onClick={() => setIsDictionaryOpen(true)}
                    className="flex w-full flex-col items-center justify-center text-indigo-300 hover:text-white transition-colors p-2.5 bg-slate-900/85 backdrop-blur-md rounded-2xl shadow-lg border border-indigo-500/20 hover:border-indigo-500/50 group"
                  >
                    <i className="fa-solid fa-book text-xl mb-1 group-hover:scale-110 transition-transform text-indigo-400"></i>
                    <span className="text-[9px] font-bold uppercase tracking-widest text-slate-400">SÖZLÜK</span>
                  </button>
                </div>
              </div>
              <h1 className="text-xl sm:text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-500 via-purple-400 to-cyan-400 tracking-wider">pbpye flash cards</h1>
            </div>

            {deck.length > 0 ? (
              <div className="w-full max-w-md relative z-10 flex flex-col items-center">
                
                <div className="w-full flex justify-between items-center mb-4 px-1">
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setIsJumpModalOpen(true)}

                        const isRev = revealedItems[jumpKey];
                        return (
                          <div key={item.originalIndex} className="p-3 bg-slate-900 hover:bg-rose-950/30 rounded-xl border border-slate-800 flex justify-between items-center transition-colors">
                            <div onClick={() => handleJumpToCard(null, item.originalIndex)} className="cursor-pointer flex-1">
                              <span className="text-xs font-bold text-rose-400 mr-2">#{item.originalIndex + 1}</span>
                              <span className="font-bold text-slate-200">{item.english}</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <span className={`text-xs select-none ${isRev ? 'text-cyan-300 font-bold bg-rose-950/60 px-1.5 py-0.5 rounded border border-rose-500/20' : 'text-slate-600 bg-slate-950 blur-[4px] cursor-pointer'}`} onClick={() => toggleReveal(jumpKey)}>{item.turkish}</span>
                              <button type="button" onClick={() => toggleReveal(jumpKey)} className="text-slate-500 hover:text-rose-400 p-0.5">{isRev ? <i className="fa-solid fa-eye-slash"></i> : <i className="fa-solid fa-eye"></i>}</button>
                              <button type="button" onClick={() => handleJumpToCard(null, item.originalIndex)} className="ml-1 px-2.5 py-1 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-lg shadow-sm">GİT</button>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                  <button type="submit" className="w-full py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(244,63,94,0.4)]">
                    IŞINLAN
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
